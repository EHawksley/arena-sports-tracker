<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arena — Sports Event Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14; --surface:#181b25; --surface2:#1f2230;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#e8e6f0; --soft:#7a7890; --muted:#4a4860;
  --c-ufc:#e8312a;  --d-ufc:rgba(232,49,42,0.13);
  --c-bjj:#9b4dca;  --d-bjj:rgba(155,77,202,0.13);
  --c-moto:#f5a623; --d-moto:rgba(245,166,35,0.13);
  --c-golf:#2ecc71; --d-golf:rgba(46,204,113,0.13);
  --radius:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Spline Sans",system-ui,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased;padding-bottom:calc(env(safe-area-inset-bottom)+16px)}

/* ── HEADER ── */
.hdr{position:sticky;top:0;z-index:100;background:rgba(13,15,20,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-family:"Fraunces",serif;font-size:21px;font-weight:600;font-variation-settings:"opsz" 144}
.logo span{color:var(--c-moto)}
.freshness{display:flex;align-items:center;gap:7px}
.fresh-lbl{font-size:11px;color:var(--soft)}
.fresh-lbl strong{color:var(--text);font-weight:600}
.refresh-btn{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--soft);cursor:pointer;font-family:inherit;letter-spacing:.03em;text-transform:uppercase;transition:all .2s}
.refresh-btn:hover{color:var(--text);border-color:var(--border2)}
.refresh-btn:active{transform:scale(.96)}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;letter-spacing:.03em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .18s}
.tab.active{color:var(--text);border-bottom-color:var(--c-moto)}

/* ── FILTERS ── */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 0}
.filters::-webkit-scrollbar{display:none}
.fbtn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--soft);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .18s;flex-shrink:0}
.fbtn .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--text)}
.fbtn[data-f="all"].active{background:rgba(255,255,255,.08);border-color:var(--border2)}
.fbtn[data-f="ufc"].active {background:var(--d-ufc);border-color:var(--c-ufc);color:var(--c-ufc)}
.fbtn[data-f="bjj"].active {background:var(--d-bjj);border-color:var(--c-bjj);color:var(--c-bjj)}
.fbtn[data-f="moto"].active{background:var(--d-moto);border-color:var(--c-moto);color:var(--c-moto)}
.fbtn[data-f="golf"].active{background:var(--d-golf);border-color:var(--c-golf);color:var(--c-golf)}

/* ── MAIN ── */
.main{padding:14px 14px 20px;max-width:680px;margin:0 auto}

/* ── DATE GROUP ── */
.date-group{margin-bottom:6px}
.date-heading{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:14px 2px 7px}
.date-heading.first{padding-top:2px}

/* ── EVENT CARD ── */
.ecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden;cursor:pointer;transition:border-color .18s,transform .12s}
.ecard:hover{transform:translateY(-1px)}
.ecard.ufc:hover {border-color:rgba(232,49,42,.3)}
.ecard.bjj:hover {border-color:rgba(155,77,202,.3)}
.ecard.moto:hover{border-color:rgba(245,166,35,.3)}
.ecard.golf:hover{border-color:rgba(46,204,113,.3)}
.ecard.next-up{background:linear-gradient(135deg,#1d2030 0%,#181b26 100%)}
.ecard.next-up.ufc {border-color:rgba(232,49,42,.45)}
.ecard.next-up.bjj {border-color:rgba(155,77,202,.45)}
.ecard.next-up.moto{border-color:rgba(245,166,35,.45)}
.ecard.next-up.golf{border-color:rgba(46,204,113,.45)}

.ecard-top{display:flex;align-items:flex-start;gap:11px;padding:13px 13px 11px}
.ecard-icon{flex-shrink:0;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ufc  .ecard-icon{background:var(--d-ufc)}
.bjj  .ecard-icon{background:var(--d-bjj)}
.moto .ecard-icon{background:var(--d-moto)}
.golf .ecard-icon{background:var(--d-golf)}

.ecard-body{flex:1;min-width:0}
.ecard-series{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.ufc  .ecard-series{color:var(--c-ufc)}
.bjj  .ecard-series{color:var(--c-bjj)}
.moto .ecard-series{color:var(--c-moto)}
.golf .ecard-series{color:var(--c-golf)}
.ecard-title{font-family:"Fraunces",serif;font-size:15.5px;font-weight:600;line-height:1.25;margin-bottom:4px;font-variation-settings:"opsz" 144;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard-sub{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:2px}
.ecard-date{font-size:11px;color:var(--soft);font-weight:500}
.ecard-loc{font-size:11px;color:var(--muted);padding-left:8px;margin-left:8px;border-left:1px solid var(--border)}
.ecard-classes{font-size:10px;color:var(--muted);margin-top:3px;font-style:italic}

.ecard-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cd{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.cd.today{background:rgba(255,255,255,.14);color:#fff}
.cd.past {background:rgba(255,255,255,.04);color:var(--muted)}
.ufc  .cd:not(.today):not(.past){background:var(--d-ufc);color:var(--c-ufc)}
.bjj  .cd:not(.today):not(.past){background:var(--d-bjj);color:var(--c-bjj)}
.moto .cd:not(.today):not(.past){background:var(--d-moto);color:var(--c-moto)}
.golf .cd:not(.today):not(.past){background:var(--d-golf);color:var(--c-golf)}

.status-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;letter-spacing:.06em;text-transform:uppercase}
.status-delayed  {background:rgba(245,166,35,.2);color:var(--c-moto)}
.status-shortened{background:rgba(155,77,202,.2);color:var(--c-bjj)}
.status-cancelled{background:rgba(232,49,42,.2);color:var(--c-ufc)}

.expand-arrow{font-size:10px;color:var(--muted);transition:transform .22s}
.ecard.open .expand-arrow{transform:rotate(180deg);color:var(--soft)}

/* ── STANDALONE BADGE ── */
.standalone-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.07);color:var(--soft)}

/* ── COMMENTARY ── */
.commentary{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1)}
.ecard.open .commentary{max-height:700px}
.commentary-inner{padding:12px 13px 15px;border-top:1px solid var(--border)}
.tp{display:flex;gap:9px;margin-bottom:11px}
.tp:last-child{margin-bottom:0}
.tp-n{flex-shrink:0;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:2px}
.ufc  .tp-n{background:var(--d-ufc);color:var(--c-ufc)}
.bjj  .tp-n{background:var(--d-bjj);color:var(--c-bjj)}
.moto .tp-n{background:var(--d-moto);color:var(--c-moto)}
.golf .tp-n{background:var(--d-golf);color:var(--c-golf)}
.tp-t{font-size:13px;line-height:1.55;color:var(--soft)}
.tp-t strong{color:var(--text);font-weight:600}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px}

/* ── OVERLAY ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(13,15,20,.75);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.overlay.on{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--c-moto);border-radius:50%;animation:spin .7s linear infinite}
.overlay p{font-size:13px;color:var(--soft)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(14px);background:#252836;border:1px solid var(--border);border-radius:22px;padding:8px 16px;font-size:12.5px;color:var(--text);opacity:0;transition:all .26s;pointer-events:none;white-space:nowrap;z-index:300}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── NEXT-UP LABEL ── */
.next-label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:2px 2px 8px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo">Arena<span>.</span></div>
    <div class="freshness">
      <div class="fresh-lbl">Data as of <strong id="data-date">—</strong></div>
      <button class="refresh-btn" onclick="doRefresh()">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M10.5 6A4.5 4.5 0 1 1 6 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M6 1.5L8 3.5M6 1.5L8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh
      </button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab('upcoming')">Upcoming</button>
    <button class="tab" onclick="setTab('past')">Past</button>
  </div>
  <div class="filters">
    <button class="fbtn active" data-f="all"  onclick="setFilter('all')"><span class="dot" style="background:#7a7890"></span>All</button>
    <button class="fbtn" data-f="ufc"  onclick="setFilter('ufc')"><span class="dot" style="background:var(--c-ufc)"></span>UFC</button>
    <button class="fbtn" data-f="bjj"  onclick="setFilter('bjj')"><span class="dot" style="background:var(--c-bjj)"></span>UFC BJJ</button>
    <button class="fbtn" data-f="moto" onclick="setFilter('moto')"><span class="dot" style="background:var(--c-moto)"></span>Motorsport</button>
    <button class="fbtn" data-f="golf" onclick="setFilter('golf')"><span class="dot" style="background:var(--c-golf)"></span>Golf</button>
  </div>
</div>

<main class="main" id="main"></main>

<div class="overlay" id="overlay"><div class="spinner"></div><p>Refreshing…</p></div>
<div class="toast" id="toast"></div>

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let filter = "all";
let tab = "upcoming";
let openCards = new Set();
let dataDate = localStorage.getItem("arena_dd") || fmt(new Date());

function fmt(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) }
function fmtEvent(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}) }
function fmtRange(s,e){
  const ds=new Date(s+"T00:00:00"),de=new Date(e+"T00:00:00");
  if(ds.getMonth()===de.getMonth()) return `${ds.toLocaleDateString("en-US",{month:"short"})} ${ds.getDate()}–${de.getDate()}, ${ds.getFullYear()}`;
  return `${ds.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${de.toLocaleDateString("en-US",{month:"short",day:"numeric"})}, ${ds.getFullYear()}`;
}
function getDate(ev){ return ev.dateStart||ev.date; }
function setDataDate(d){ dataDate=d; localStorage.setItem("arena_dd",d); document.getElementById("data-date").textContent=d }

function countdown(ds){
  const today=new Date(); today.setHours(0,0,0,0);
  const ev=new Date(ds+"T00:00:00");
  const diff=Math.round((ev-today)/86400000);
  if(diff<0)  return {label:"Completed",cls:"past"};
  if(diff===0)return {label:"TODAY",cls:"today"};
  if(diff===1)return {label:"Tomorrow",cls:""};
  if(diff<7)  return {label:`${diff} days`,cls:""};
  if(diff<14) return {label:"Next week",cls:""};
  const w=Math.round(diff/7);
  if(w<8)     return {label:`${w}w away`,cls:""};
  return {label:`${Math.round(diff/30.4)}mo away`,cls:""};
}

function statusBadge(s){
  if(!s||s==="scheduled") return "";
  return `<span class="status-badge status-${s}">${s}</span>`;
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function renderCard(ev, isNext){
  const cd = countdown(getDate(ev));
  const open = openCards.has(ev.id);
  const isStandalone = ev.entityType==="standalone";
  const dateStr = ev.dateStart ? fmtRange(ev.dateStart, ev.dateEnd||ev.dateStart) : fmtEvent(ev.date);
  const seriesLabel = isStandalone ? (ev.series||"") : ev.series;
  const classesStr = ev.classes ? ev.classes.join(" · ") : "";

  const tps = (ev.points||[]).map((p,i)=>`
    <div class="tp">
      <div class="tp-n">${i+1}</div>
      <div class="tp-t"><strong>${p.h}.</strong> ${p.b}</div>
    </div>`).join("");

  return `
  <div class="ecard ${ev.sport}${isNext?" next-up":""}${open?" open":""}" id="ec-${ev.id}" onclick="toggleCard('${ev.id}')">
    <div class="ecard-top">
      <div class="ecard-icon">${ev.icon}</div>
      <div class="ecard-body">
        <div class="ecard-series">${seriesLabel}${isStandalone?` <span class="standalone-tag">Standalone</span>`:""}</div>
        <div class="ecard-title">${ev.title}</div>
        <div class="ecard-sub">
          <span class="ecard-date">${dateStr}</span>
          <span class="ecard-loc">${ev.location}</span>
        </div>
        ${classesStr?`<div class="ecard-classes">${classesStr}</div>`:""}
        ${ev.note?`<div class="ecard-classes">${ev.note}</div>`:""}
      </div>
      <div class="ecard-right">
        <div class="cd ${cd.cls}">${cd.label}</div>
        ${statusBadge(ev.status)}
        <div class="expand-arrow">▾</div>
      </div>
    </div>
    <div class="commentary">
      <div class="commentary-inner">${tps}</div>
    </div>
  </div>`;
}

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  let evs = EVENTS.filter(e => filter==="all" || e.sport===filter);

  // Split upcoming vs past
  const upcoming = evs.filter(e => new Date(getDate(e)+"T00:00:00") >= today)
                      .sort((a,b) => new Date(getDate(a)) - new Date(getDate(b)));
  const past     = evs.filter(e => new Date(getDate(e)+"T00:00:00") < today)
                      .sort((a,b) => new Date(getDate(b)) - new Date(getDate(a)));

  const list = tab==="upcoming" ? upcoming : past;

  if(list.length===0){
    document.getElementById("main").innerHTML=`<div class="empty">No ${tab} events${filter!=="all"?" in this category":""}.</div>`;
    return;
  }

  let html = "";
  let lastMonth = null;
  let isFirst = true;

  list.forEach((ev, idx) => {
    const d = new Date(getDate(ev)+"T00:00:00");
    const monthKey = `${d.getFullYear()}-${d.getMonth()}`;
    const monthLabel = d.toLocaleDateString("en-US",{month:"long",year:"numeric"});

    if(monthKey !== lastMonth){
      if(lastMonth !== null) html += `</div>`;
      html += `<div class="date-group"><div class="date-heading${isFirst?" first":""}">${monthLabel}</div>`;
      lastMonth = monthKey;
      isFirst = false;
    }

    const isNext = tab==="upcoming" && idx===0;
    if(isNext) html += `<div class="next-label">Next Up</div>`;
    html += renderCard(ev, isNext);
  });

  html += `</div>`;
  document.getElementById("main").innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════════════════
function toggleCard(id){
  if(openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  const el = document.getElementById("ec-"+id);
  if(el){
    el.classList.toggle("open", openCards.has(id));
    const comm = el.querySelector(".commentary");
    if(comm) comm.style.maxHeight = openCards.has(id) ? "700px" : "0";
    const arr = el.querySelector(".expand-arrow");
    if(arr) arr.style.transform = openCards.has(id) ? "rotate(180deg)" : "";
  }
}

function setFilter(f){
  filter=f;
  document.querySelectorAll(".fbtn").forEach(b=>b.classList.toggle("active",b.dataset.f===f));
  render();
}

function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.textContent.toLowerCase()===t));
  render();
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  setTimeout(()=>t.classList.remove("on"),2600);
}

function doRefresh(){
  const btn=document.querySelector(".refresh-btn");
  const ov=document.getElementById("overlay");
  btn.classList.add("spinning");
  ov.classList.add("on");
  setTimeout(()=>{
    const now=new Date();
    setDataDate(fmt(now));
    btn.classList.remove("spinning");
    ov.classList.remove("on");
    render();
    showToast("✓ Refreshed — "+fmt(now));
  },1600);
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded",()=>{
  setDataDate(dataDate);
  render();
});
</script>
