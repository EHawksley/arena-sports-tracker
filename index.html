<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arena — Sports Event Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --surface: #1a1d27;
  --border: rgba(255,255,255,0.07);
  --text: #e8e6f0;
  --text-soft: #7a7890;
  --text-muted: #4a4860;

  /* sport colours */
  --c-ufc:   #e8312a; --d-ufc:   rgba(232,49,42,0.12);
  --c-bjj:   #9b4dca; --d-bjj:   rgba(155,77,202,0.12);
  --c-moto:  #f5a623; --d-moto:  rgba(245,166,35,0.12);
  --c-golf:  #2ecc71; --d-golf:  rgba(46,204,113,0.12);

  /* status colours */
  --s-scheduled: rgba(255,255,255,0.06);
  --s-delayed:   rgba(245,166,35,0.18);
  --s-shortened: rgba(155,77,202,0.18);
  --s-cancelled: rgba(232,49,42,0.18);

  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Spline Sans",system-ui,sans-serif;
  min-height:100dvh;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(13,15,20,0.93);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  padding:14px 18px 12px;
}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wordmark{font-family:"Fraunces",serif;font-size:22px;font-weight:600;letter-spacing:-0.3px;font-variation-settings:"opsz" 144}
.wordmark span{color:var(--c-moto)}

.freshness{display:flex;align-items:center;gap:8px}
.freshness-label{font-size:11px;color:var(--text-soft);letter-spacing:.02em}
.freshness-label strong{color:var(--text);font-weight:600}

.refresh-btn{
  display:flex;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:5px 11px;font-size:11px;font-weight:600;color:var(--text-soft);
  cursor:pointer;transition:all .2s;font-family:inherit;
  letter-spacing:.03em;text-transform:uppercase;
}
.refresh-btn:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
.refresh-btn:active{transform:scale(.96)}
.refresh-btn svg{transition:transform .5s}
.refresh-btn.spinning svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FILTERS ── */
.filters{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px;
  flex-wrap:nowrap;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--text-soft);font-size:11.5px;font-weight:600;
  font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .18s;
  letter-spacing:.02em;flex-shrink:0;
}
.filter-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
.filter-btn.active{color:var(--text)}
.filter-btn[data-f="all"].active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.filter-btn[data-f="ufc"].active {background:var(--d-ufc); border-color:var(--c-ufc); color:var(--c-ufc)}
.filter-btn[data-f="bjj"].active {background:var(--d-bjj); border-color:var(--c-bjj); color:var(--c-bjj)}
.filter-btn[data-f="moto"].active{background:var(--d-moto);border-color:var(--c-moto);color:var(--c-moto)}
.filter-btn[data-f="golf"].active{background:var(--d-golf);border-color:var(--c-golf);color:var(--c-golf)}

/* ── MAIN ── */
.main{padding:18px 14px 48px;max-width:660px;margin:0 auto}

/* ── SECTION LABELS ── */
.section-label{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-muted);margin:20px 0 9px;padding-left:2px;
}
.section-label.first{margin-top:0}

/* ── CHAMPIONSHIP HEADER ── */
.champ-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 8px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.025);
  border-radius:var(--radius) var(--radius) 0 0;
  cursor:pointer;
  user-select:none;
}
.champ-icon{font-size:16px}
.champ-name{font-family:"Fraunces",serif;font-size:14px;font-weight:600;font-variation-settings:"opsz" 144;flex:1}
.champ-meta{font-size:11px;color:var(--text-muted);white-space:nowrap}
.champ-toggle{font-size:12px;color:var(--text-muted);transition:transform .25s}
.champ-block.collapsed .champ-toggle{transform:rotate(-90deg)}

/* ── CHAMPIONSHIP BLOCK ── */
.champ-block{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
}
.champ-block.ufc  .champ-header{border-left:3px solid var(--c-ufc)}
.champ-block.bjj  .champ-header{border-left:3px solid var(--c-bjj)}
.champ-block.moto .champ-header{border-left:3px solid var(--c-moto)}
.champ-block.golf .champ-header{border-left:3px solid var(--c-golf)}

.champ-body{overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.champ-block.collapsed .champ-body{max-height:0!important}

/* ── EVENT ROW ── */
.event-row{
  border-top:1px solid var(--border);cursor:pointer;
  transition:background .15s;
}
.event-row:hover{background:rgba(255,255,255,.03)}
.event-row.expanded{background:rgba(255,255,255,.025)}

.row-main{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row-icon{font-size:15px;flex-shrink:0;width:24px;text-align:center}
.row-info{flex:1;min-width:0}
.row-title{
  font-size:13.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;
}
.row-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-date{font-size:11px;color:var(--text-soft)}
.row-loc{font-size:11px;color:var(--text-muted)}
.row-loc::before{content:"·";margin-right:8px}

.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}

/* countdown pill */
.cd-pill{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;
  white-space:nowrap;letter-spacing:.02em;
}
.cd-pill.today{background:rgba(255,255,255,.13);color:#fff}
.cd-pill.past {background:rgba(255,255,255,.04);color:var(--text-muted)}
.ufc  .cd-pill:not(.today):not(.past){background:var(--d-ufc);color:var(--c-ufc)}
.bjj  .cd-pill:not(.today):not(.past){background:var(--d-bjj);color:var(--c-bjj)}
.moto .cd-pill:not(.today):not(.past){background:var(--d-moto);color:var(--c-moto)}
.golf .cd-pill:not(.today):not(.past){background:var(--d-golf);color:var(--c-golf)}

/* status badge */
.status-badge{
  font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px;
  letter-spacing:.06em;text-transform:uppercase;
}
.status-scheduled{display:none} /* default — don't show clutter */
.status-delayed   {background:var(--s-delayed);  color:var(--c-moto)}
.status-shortened {background:var(--s-shortened);color:var(--c-bjj)}
.status-cancelled {background:var(--s-cancelled);color:var(--c-ufc)}

.expand-icon{font-size:11px;color:var(--text-muted);transition:transform .22s}
.event-row.expanded .expand-icon{transform:rotate(180deg);color:var(--text-soft)}

/* ── STANDALONE CARD (no championship wrapper) ── */
.standalone-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
  cursor:pointer;transition:border-color .2s,transform .15s;
}
.standalone-card:hover{transform:translateY(-1px)}
.standalone-card.ufc:hover {border-color:rgba(232,49,42,.35)}
.standalone-card.bjj:hover {border-color:rgba(155,77,202,.35)}
.standalone-card.moto:hover{border-color:rgba(245,166,35,.35)}
.standalone-card.golf:hover{border-color:rgba(46,204,113,.35)}
.standalone-card.is-next{background:linear-gradient(135deg,#1e2130 0%,#191c28 100%)}
.standalone-card.ufc.is-next {border-color:rgba(232,49,42,.45)}
.standalone-card.bjj.is-next {border-color:rgba(155,77,202,.45)}
.standalone-card.moto.is-next{border-color:rgba(245,166,35,.45)}
.standalone-card.golf.is-next{border-color:rgba(46,204,113,.45)}

.sc-header{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 12px}
.sc-badge{
  flex-shrink:0;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.ufc  .sc-badge{background:var(--d-ufc)}
.bjj  .sc-badge{background:var(--d-bjj)}
.moto .sc-badge{background:var(--d-moto)}
.golf .sc-badge{background:var(--d-golf)}

.sc-meta{flex:1;min-width:0}
.sc-sport-tag{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.ufc  .sc-sport-tag{color:var(--c-ufc)}
.bjj  .sc-sport-tag{color:var(--c-bjj)}
.moto .sc-sport-tag{color:var(--c-moto)}
.golf .sc-sport-tag{color:var(--c-golf)}
.sc-title{font-family:"Fraunces",serif;font-size:16px;font-weight:600;line-height:1.25;margin-bottom:4px;font-variation-settings:"opsz" 144;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-details{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-date{font-size:11.5px;color:var(--text-soft);font-weight:500}
.sc-loc{font-size:11.5px;color:var(--text-muted)}
.sc-loc::before{content:"·";margin-right:8px}
.sc-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* ── COMMENTARY ── */
.commentary{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.expanded .commentary,.event-row.expanded .commentary{max-height:600px}

.commentary-inner{
  padding:14px 14px 16px;border-top:1px solid var(--border);
}
.talking-point{display:flex;gap:10px;margin-bottom:12px}
.talking-point:last-child{margin-bottom:0}
.tp-num{
  flex-shrink:0;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;margin-top:2px;
}
.ufc  .tp-num{background:var(--d-ufc);color:var(--c-ufc)}
.bjj  .tp-num{background:var(--d-bjj);color:var(--c-bjj)}
.moto .tp-num{background:var(--d-moto);color:var(--c-moto)}
.golf .tp-num{background:var(--d-golf);color:var(--c-golf)}
.tp-text{font-size:13px;line-height:1.55;color:var(--text-soft)}
.tp-text strong{color:var(--text);font-weight:600}

/* ── NEXT-UP LABEL ── */
.next-label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px;padding-left:2px}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted);font-size:14px}

/* ── REFRESH OVERLAY ── */
.refresh-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(13,15,20,.72);backdrop-filter:blur(4px);
  z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px;
}
.refresh-overlay.active{display:flex}
.refresh-overlay .spinner{
  width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--c-moto);border-radius:50%;animation:spin .7s linear infinite;
}
.refresh-overlay p{font-size:13px;color:var(--text-soft);letter-spacing:.04em}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(16px);
  background:#252836;border:1px solid var(--border);border-radius:24px;
  padding:9px 18px;font-size:12.5px;color:var(--text);
  opacity:0;transition:all .28s;pointer-events:none;white-space:nowrap;z-index:300;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="wordmark">Arena<span>.</span></div>
    <div class="freshness">
      <div class="freshness-label">Data as of <strong id="data-date">—</strong></div>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
        <svg id="refresh-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M10.5 6A4.5 4.5 0 1 1 6 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6 1.5L8 3.5M6 1.5L8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-f="all"  onclick="setFilter('all')"><span class="dot" style="background:#7a7890"></span>All</button>
    <button class="filter-btn"        data-f="ufc"  onclick="setFilter('ufc')"><span class="dot" style="background:var(--c-ufc)"></span>UFC</button>
    <button class="filter-btn"        data-f="bjj"  onclick="setFilter('bjj')"><span class="dot" style="background:var(--c-bjj)"></span>UFC BJJ</button>
    <button class="filter-btn"        data-f="moto" onclick="setFilter('moto')"><span class="dot" style="background:var(--c-moto)"></span>Motorsport</button>
    <button class="filter-btn"        data-f="golf" onclick="setFilter('golf')"><span class="dot" style="background:var(--c-golf)"></span>Golf</button>
  </div>
</div>

<main class="main" id="main-content"></main>

<div class="refresh-overlay" id="refresh-overlay">
  <div class="spinner"></div>
  <p>Refreshing event data…</p>
</div>
<div class="toast" id="toast"></div>

//  STATE
// ═══════════════════════════════════════════════════════
let currentFilter = "all";
let dataDate = localStorage.getItem("arena_data_date") || fmtDate(new Date());
let expandedItems = new Set();
let collapsedChamps = new Set();

function fmtDate(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) }
function fmtEventDate(s){ const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}) }
function fmtDateRange(s,e){
  const ds=new Date(s+"T00:00:00"), de=new Date(e+"T00:00:00");
  const mo=ds.toLocaleDateString("en-US",{month:"short"});
  return `${mo} ${ds.getDate()}–${de.getDate()}, ${ds.getFullYear()}`;
}

function setDataDate(d){ dataDate=d; localStorage.setItem("arena_data_date",d); document.getElementById("data-date").textContent=d }

function getCountdown(dateStr){
  const today=new Date(); today.setHours(0,0,0,0);
  const ev=new Date(dateStr+"T00:00:00");
  const diff=Math.round((ev-today)/86400000);
  if(diff<0)  return {label:"Completed",cls:"past"};
  if(diff===0)return {label:"TODAY",cls:"today"};
  if(diff===1)return {label:"Tomorrow",cls:""};
  if(diff<7)  return {label:`${diff} days`,cls:""};
  if(diff<14) return {label:"Next week",cls:""};
  const w=Math.round(diff/7);
  if(w<8)     return {label:`${w}w away`,cls:""};
  return {label:`${Math.round(diff/30.4)}mo away`,cls:""};
}

function statusBadge(status){
  if(!status||status==="scheduled") return "";
  const map={delayed:"delayed",shortened:"shortened",cancelled:"cancelled"};
  const cls=map[status]||"";
  return `<span class="status-badge status-${cls}">${status}</span>`;
}

function talkingPoints(points, sport){
  return points.map((p,i)=>`
    <div class="talking-point">
      <div class="tp-num">${i+1}</div>
      <div class="tp-text"><strong>${p.head}.</strong> ${p.body}</div>
    </div>`).join("");
}

function renderRoundRow(round, sport, isFirst){
  const cd=getCountdown(round.date);
  const expanded=expandedItems.has(round.id);
  return `
  <div class="event-row ${sport}${expanded?" expanded":""}" id="row-${round.id}" onclick="toggleItem('${round.id}')">
    <div class="row-main">
      <div class="row-info">
        <div class="row-title">${round.title}</div>
        <div class="row-sub">
          <span class="row-date">${fmtEventDate(round.date)}</span>
          <span class="row-loc">${round.location}</span>
        </div>
      </div>
      <div class="row-right">
        <div class="cd-pill ${cd.cls}">${cd.label}</div>
        ${statusBadge(round.status)}
        <div class="expand-icon">▾</div>
      </div>
    </div>
    <div class="commentary">
      <div class="commentary-inner">
        ${talkingPoints(round.points, sport)}
      </div>
    </div>
  </div>`;
}

function renderChampBlock(entity, isNextEntity){
  const collapsed=collapsedChamps.has(entity.id);
  const classesStr=entity.classes.join(" · ");
  // find next upcoming round
  const today=new Date(); today.setHours(0,0,0,0);
  const upcoming=entity.rounds.filter(r=>new Date(r.date+"T00:00:00")>=today);
  const nextRound=upcoming[0];
  const metaStr=nextRound?`Next: ${fmtEventDate(nextRound.date)}`:"Season complete";
  const bodyHeight=entity.rounds.length*70+200; // rough estimate

  return `
  <div class="champ-block ${entity.sport}${collapsed?" collapsed":""}" id="champ-${entity.id}">
    <div class="champ-header" onclick="toggleChamp('${entity.id}')">
      <span class="champ-icon">${entity.icon}</span>
      <div>
        <div class="champ-name">${entity.series}</div>
        <div style="font-size:10.5px;color:var(--text-muted);margin-top:1px">${classesStr}</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <div class="champ-meta">${metaStr}</div>
        <div class="champ-toggle">▾</div>
      </div>
    </div>
    <div class="champ-body" style="max-height:${collapsed?0:bodyHeight+"px"}">
      ${entity.rounds.map((r,i)=>renderRoundRow(r,entity.sport,i===0)).join("")}
    </div>
  </div>`;
}

function renderStandaloneCard(entity, isNext){
  const expanded=expandedItems.has(entity.id);
  const dateStr=entity.dateStart
    ? fmtDateRange(entity.dateStart, entity.dateEnd||entity.dateStart)
    : fmtEventDate(entity.date||entity.dateStart);
  const cdDate=entity.dateStart||entity.date;
  const cd=getCountdown(cdDate);
  const sportLabel={ufc:"UFC",bjj:"UFC BJJ",moto:"Motorsport",golf:"Golf"}[entity.sport];

  return `
  <div class="standalone-card ${entity.sport}${isNext?" is-next":""}${expanded?" expanded":""}" id="sc-${entity.id}" onclick="toggleItem('${entity.id}')">
    <div class="sc-header">
      <div class="sc-badge">${entity.icon}</div>
      <div class="sc-meta">
        <div class="sc-sport-tag">${sportLabel} · Standalone Event</div>
        <div class="sc-title">${entity.title}</div>
        <div class="sc-details">
          <span class="sc-date">${dateStr}</span>
          <span class="sc-loc">${entity.location}</span>
        </div>
        ${entity.note?`<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;font-style:italic">${entity.note}</div>`:""}
      </div>
      <div class="sc-right">
        <div class="cd-pill ${cd.cls}">${cd.label}</div>
        ${statusBadge(entity.status)}
        <div class="expand-icon">▾</div>
      </div>
    </div>
    <div class="commentary">
      <div class="commentary-inner">
        ${talkingPoints(entity.points, entity.sport)}
      </div>
    </div>
  </div>`;
}

function getNextDate(entity){
  if(entity.entityType==="standalone") return entity.dateStart||entity.date;
  const today=new Date(); today.setHours(0,0,0,0);
  const upcoming=entity.rounds.filter(r=>new Date(r.date+"T00:00:00")>=today);
  if(upcoming.length) return upcoming[0].date;
  // all past — return last round date
  return entity.rounds[entity.rounds.length-1].date;
}

function render(){
  const today=new Date(); today.setHours(0,0,0,0);
  let entities=DATA;
  if(currentFilter!=="all") entities=DATA.filter(e=>e.sport===currentFilter);

  // sort by next upcoming date
  const sorted=[...entities].sort((a,b)=>{
    const da=new Date(getNextDate(a)+"T00:00:00");
    const db=new Date(getNextDate(b)+"T00:00:00");
    return da-db;
  });

  if(sorted.length===0){
    document.getElementById("main-content").innerHTML=`<div class="empty-state">No events found.</div>`;
    return;
  }

  let html="";
  let firstUpcoming=true;
  let shownSectionLabel=false;

  sorted.forEach((entity,idx)=>{
    const nextDate=new Date(getNextDate(entity)+"T00:00:00");
    const isUpcoming=nextDate>=today;
    const isNext=isUpcoming&&firstUpcoming;

    if(isNext){
      html+=`<div class="next-label">Next Up</div>`;
      firstUpcoming=false;
    } else if(isUpcoming&&!shownSectionLabel){
      html+=`<div class="section-label">Upcoming</div>`;
      shownSectionLabel=true;
    }

    if(entity.entityType==="championship"){
      html+=renderChampBlock(entity, isNext);
    } else {
      html+=renderStandaloneCard(entity, isNext);
    }
  });

  document.getElementById("main-content").innerHTML=html;
}

// ═══════════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════════
function toggleItem(id){
  if(expandedItems.has(id)) expandedItems.delete(id);
  else expandedItems.add(id);
  render();
  // scroll the toggled item into view gently
  setTimeout(()=>{
    const el=document.getElementById("row-"+id)||document.getElementById("sc-"+id);
    if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"});
  },50);
}

function toggleChamp(id){
  if(collapsedChamps.has(id)) collapsedChamps.delete(id);
  else collapsedChamps.add(id);
  const block=document.getElementById("champ-"+id);
  if(!block) return;
  const body=block.querySelector(".champ-body");
  const collapsed=collapsedChamps.has(id);
  block.classList.toggle("collapsed",collapsed);
  body.style.maxHeight=collapsed?"0":"2000px";
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.f===f));
  render();
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);
}

function refreshData(){
  const btn=document.getElementById("refresh-btn");
  const overlay=document.getElementById("refresh-overlay");
  btn.classList.add("spinning");
  overlay.classList.add("active");
  setTimeout(()=>{
    const now=new Date();
    setDataDate(fmtDate(now));
    btn.classList.remove("spinning");
    overlay.classList.remove("active");
    render();
    showToast("✓ Data refreshed — "+fmtDate(now));
  },1800);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded",()=>{
  setDataDate(dataDate);
  render();
});
</script>
